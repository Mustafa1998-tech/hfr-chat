<div class="chat-home">
  <div class="home-center">
    <h1 class="greeting">{{ platform.tr('greeting').replace('{name}', firstName()) }}</h1>
    <app-chat-composer
      [selectedModel]="selectedModel()"
      (selectedModelChange)="onModelChange($event)"
      [(deepResearch)]="deepResearch"
      [models]="models()"
      (send)="onSend($event)"
    />
  </div>
</div>
